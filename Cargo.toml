[package]
name = "gear-step"
version = "0.1.0"
edition = "2021"
description = "Parametric involute gear generator with STEP (AP214) export"

[lib]
name = "gear_step"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gear-step"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
