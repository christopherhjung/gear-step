# Build the WebAssembly module and publish the gear lab to GitHub Pages.
#
# ONE MANUAL STEP, ONCE: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Without it configure-pages below fails with
# "Get Pages site failed ... Not Found", because the repository has no Pages
# site to configure yet.
#
# The action can create the site itself with `enablement: true`, but that needs
# a token with administration:write - GITHUB_TOKEN is not enough - so a PAT in
# a secret. Flipping the setting by hand is less machinery for a one off.

name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time per ref, newest wins. Scoped by ref on purpose: with a
# single shared group a pull request build would cancel a deployment of main
# that was already in flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Early, so a repository that has not had Pages switched on fails in
      # seconds instead of after the whole build.
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Optional, and build.sh keeps the plain module if it is missing or
      # unhappy - it just makes the download smaller.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      - name: Test the generator
        run: cargo test --release

      - name: Check the CLI still runs
        run: |
          cargo build --release
          ./target/release/gear-step -z 24 --module 2 --width 12 --bore 20 \
            -o /tmp/pinion.step -q
          test -s /tmp/pinion.step

      - name: Build the WebAssembly module and the page
        run: ./build.sh

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css web/gear.wasm _site/
          cp dist/gear-step.html _site/          # the same app as one file
          ls -l _site
          # no .nojekyll: an artifact deployment serves the files as they are,
          # Jekyll never runs, and upload-pages-artifact drops dotfiles anyway

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
