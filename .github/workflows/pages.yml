# Build the WebAssembly module and publish the gear lab to GitHub Pages.
#
# Needs "Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
# switched on once, by hand.

name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push cancel a running build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Optional, and build.sh keeps the plain module if it is missing or
      # unhappy - it just makes the download smaller.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      - name: Test the generator
        run: cargo test --release

      - name: Check the CLI still runs
        run: |
          cargo build --release
          ./target/release/gear-step -z 24 --module 2 --width 12 --bore 20 \
            -o /tmp/pinion.step -q
          test -s /tmp/pinion.step

      - name: Build the WebAssembly module and the page
        run: ./build.sh

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css web/gear.wasm _site/
          cp dist/gear-step.html _site/          # the same app as one file
          touch _site/.nojekyll
          ls -l _site

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
